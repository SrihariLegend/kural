[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kural"
version = "0.3.0"
description = "Plain English to bash, fully local: a small parser copies your words into a typed program that compiles to a command"
requires-python = ">=3.9"
dependencies = ["numpy"]
license = { text = "MIT" }

[project.optional-dependencies]
train = ["torch"]

[project.scripts]
kural = "kural.cli:main"

[tool.setuptools.packages.find]
include = ["kural*"]

[tool.setuptools.package-data]
kural = ["weights.npz", "model.kural", "lexicon.json", "lang/*.txt", "shell/*.bash"]
